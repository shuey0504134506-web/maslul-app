<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>מסלול - אין חיבור לאינטרנט</title>
    <style>
      body {
        font-family: 'Heebo', sans-serif;
        background: #FBF7F1;
        color: #2B2621;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
        padding: 2rem;
      }
      .card { max-width: 24rem; }
      h1 { font-size: 1.4rem; margin-bottom: 0.75rem; }
      p { color: #5C5348; line-height: 1.6; }
      button {
        margin-top: 1.5rem;
        background: #C99A4B;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 1rem;
        font-size: 1rem;
        font-family: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>אין כרגע חיבור לאינטרנט</h1>
      <p>
        זו הפעם הראשונה שאתם פותחים את "מסלול" במכשיר הזה, ולכן היא זקוקה לחיבור ראשוני
        לטעינת האפליקציה. לאחר הטעינה הראשונה, האפליקציה תעבוד גם ללא אינטרנט.
      </p>
      <button onclick="window.location.reload()">נסה שוב</button>
    </div>
  </body>
</html>
